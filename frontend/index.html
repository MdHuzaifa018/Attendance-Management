<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Smart Attendance & Academic Management System for Nalanda College. Real-time tracking and seamless coordination." />
    <meta name="author" content="Md Huzaifa" />
    <title>Nalanda College | Attendance Management System</title>
    
    <!-- Preload Kapra Fonts & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/fonts/kapra-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/kapra-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%); font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: relative; overflow: hidden; padding: 20px;">
        
        <!-- Ambient background aura -->
        <div style="position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(245, 158, 11, 0.05) 50%, transparent 70%); filter: blur(60px); pointer-events: none; border-radius: 50%; animation: pulseAura 4s ease-in-out infinite alternate;"></div>

        <!-- Glass Card -->
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; padding: 42px 36px; max-width: 420px; width: 100%; box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(99, 102, 241, 0.2); text-align: center;">
          
          <!-- Logo Container with Glowing Halo -->
          <div style="position: relative; margin-bottom: 24px;">
            <div style="position: absolute; inset: -8px; background: linear-gradient(135deg, rgba(0, 56, 255, 0.4), rgba(245, 158, 11, 0.3)); border-radius: 28px; filter: blur(12px); animation: pulseLogo 3s ease-in-out infinite alternate;"></div>
            <img src="/logo.png" alt="Nalanda College ERP" style="position: relative; z-index: 2; width: 88px; height: 88px; object-fit: contain; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);" />
          </div>

          <!-- Title -->
          <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">
            <span style="font-size: 22px; font-weight: 900; letter-spacing: 0.5px; color: #ffffff;">NALANDA</span>
            <span style="font-size: 22px; font-weight: 900; letter-spacing: 0.5px; color: #6366f1;">ERP</span>
          </div>

          <!-- Subtitle -->
          <p style="font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase; margin: 0 0 24px 0;">
            Patliputra University Unit
          </p>

          <!-- Elegant Liquid Progress Bar -->
          <div style="width: 100%; max-width: 260px; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 16px;">
            <div style="position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: linear-gradient(90deg, #0038ff, #6366f1, #fbbf24); border-radius: 9999px; animation: liquidProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;"></div>
          </div>

          <!-- Status Indicator -->
          <div style="display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: #cbd5e1; letter-spacing: 0.8px;">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: blinkStatus 1.2s infinite ease-in-out;"></span>
            <span>Initializing Academic Workspace...</span>
          </div>

        </div>

        <style>
          @keyframes liquidProgress {
            0% { left: -40%; width: 40%; }
            50% { width: 60%; }
            100% { left: 100%; width: 40%; }
          }
          @keyframes pulseLogo {
            0% { opacity: 0.5; transform: scale(0.96); }
            100% { opacity: 0.9; transform: scale(1.04); }
          }
          @keyframes pulseAura {
            0% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 0.8; transform: scale(1.1); }
          }
          @keyframes blinkStatus {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.15); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
