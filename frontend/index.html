<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Smart Attendance & Academic Management System for Nalanda College. Real-time tracking and seamless coordination." />
    <meta name="author" content="Md Huzaifa" />
    <title>Nalanda College | Attendance Management System</title>
    
    <!-- Preload Kapra Fonts & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/fonts/kapra-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/kapra-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="app-splash-loader">
        <div class="splash-card">
          <div class="splash-logo-wrap">
            <div class="splash-glow"></div>
            <img src="/logo.png" alt="Nalanda College ERP" class="splash-logo" />
          </div>
          <div class="splash-title">
            <span class="splash-title-dark">NALANDA</span>
            <span class="splash-title-blue">ERP</span>
          </div>
          <p class="splash-sub">Smart Campus Academic Portal</p>
          <div class="splash-bar-track">
            <div class="splash-bar-fill"></div>
          </div>
          <div class="splash-status">
            <span class="splash-dot"></span>
            <span>Loading Academic Workspace...</span>
          </div>
        </div>
      </div>
      <style>
        #app-splash-loader {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          background: #f8fafc;
          font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
          transition: background-color 0.3s;
        }
        .splash-card {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          background: rgba(255, 255, 255, 0.9);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(226, 232, 240, 0.9);
          border-radius: 28px;
          padding: 36px 32px;
          max-width: 360px;
          width: 100%;
          box-shadow: 0 25px 60px -15px rgba(79, 70, 229, 0.15);
          text-align: center;
        }
        .splash-logo-wrap {
          position: relative;
          margin-bottom: 16px;
        }
        .splash-glow {
          position: absolute;
          inset: -6px;
          background: linear-gradient(135deg, rgba(79, 70, 229, 0.3), rgba(251, 191, 36, 0.25));
          border-radius: 22px;
          filter: blur(10px);
          animation: splashPulse 2.4s ease-in-out infinite alternate;
        }
        .splash-logo {
          position: relative;
          z-index: 2;
          width: 72px;
          height: 72px;
          object-fit: contain;
          background: #ffffff;
          padding: 6px;
          border-radius: 20px;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
          animation: splashBounce 2.4s ease-in-out infinite;
        }
        .splash-title {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 22px;
          font-weight: 900;
          letter-spacing: -0.02em;
          margin-bottom: 2px;
        }
        .splash-title-dark { color: #0f172a; }
        .splash-title-blue { color: #4f46e5; }
        .splash-sub {
          font-size: 10px;
          font-weight: 800;
          color: #64748b;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          margin: 0 0 20px 0;
        }
        .splash-bar-track {
          width: 190px;
          height: 5px;
          background: #e2e8f0;
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
          margin-bottom: 14px;
        }
        .splash-bar-fill {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 45%;
          background: linear-gradient(90deg, #4f46e5, #7c3aed, #fbbf24);
          border-radius: 9999px;
          animation: splashBar 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        .splash-status {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 11px;
          font-weight: 600;
          color: #64748b;
        }
        .splash-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: #10b981;
          box-shadow: 0 0 8px #10b981;
          animation: splashDot 1.4s ease-in-out infinite alternate;
        }

        @keyframes splashBar {
          0% { left: -40%; width: 40%; }
          50% { width: 65%; }
          100% { left: 100%; width: 40%; }
        }
        @keyframes splashPulse {
          0% { opacity: 0.4; transform: scale(0.96); }
          100% { opacity: 0.8; transform: scale(1.04); }
        }
        @keyframes splashBounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-3px); }
        }
        @keyframes splashDot {
          0% { opacity: 0.4; }
          100% { opacity: 1; }
        }

        /* Dark Mode Theme Adjustment */
        @media (prefers-color-scheme: dark) {
          #app-splash-loader { background: #020617; }
          .splash-card {
            background: rgba(15, 23, 42, 0.85);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
          }
          .splash-logo { background: #0f172a; }
          .splash-title-dark { color: #f8fafc; }
          .splash-title-blue { color: #6366f1; }
          .splash-sub { color: #94a3b8; }
          .splash-bar-track { background: rgba(255, 255, 255, 0.1); }
          .splash-status { color: #cbd5e1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
