    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="description" content="Nalanda College ERP - Smart Attendance & Academic Management System. Real-time tracking and seamless coordination." />

    <title>Nalanda College ERP | Attendance & Academic Management System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="/fonts/kapra-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/kapra-italic.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
      }
      .dark html, .dark body, html.dark {
        background-color: #020617;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("app_theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
